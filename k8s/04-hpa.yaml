# Scales between 3 and 6 replicas based on CPU usage.
# Requires metrics-server:  minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubepulse-hpa
  namespace: kubepulse
  labels:
    app: kubepulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubepulse
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
